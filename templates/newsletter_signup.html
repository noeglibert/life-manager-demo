<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe to Newsletter</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--background);
            padding: 1rem;
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .signup-card {
            background: var(--surface);
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 460px;
            border: 1px solid var(--border-color);
        }

        .signup-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .signup-logo {
            width: 56px;
            height: 56px;
            margin-bottom: 1rem;
            opacity: 0.8;
        }

        .signup-title {
            font-family: 'DM Serif Display', Georgia, serif;
            font-size: 1.6rem;
            color: var(--slate-dark);
            margin: 0 0 0.5rem;
        }

        .signup-subtitle {
            color: var(--slate-light);
            font-size: 0.95rem;
            margin: 0;
            line-height: 1.5;
        }

        .signup-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .signup-input,
        .signup-textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            background: var(--surface);
            color: var(--slate-dark);
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .signup-input:focus,
        .signup-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .signup-input::placeholder,
        .signup-textarea::placeholder {
            color: var(--slate-light);
            opacity: 0.7;
        }

        .signup-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .signup-btn {
            width: 100%;
            padding: 0.85rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 0.5rem;
        }

        .signup-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .signup-btn:active {
            transform: translateY(0);
        }

        .signup-success {
            text-align: center;
            padding: 2rem 1rem;
        }

        .signup-success-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }

        .signup-success h2 {
            font-family: 'DM Serif Display', Georgia, serif;
            font-size: 1.3rem;
            color: var(--slate-dark);
            margin: 0 0 0.5rem;
        }

        .signup-success p {
            color: var(--slate-light);
            font-size: 0.9rem;
            margin: 0;
        }

        .signup-error {
            background: rgba(160, 64, 42, 0.08);
            color: #A0402A;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
        }

        .signup-field-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--slate-medium);
            margin-bottom: 0.25rem;
            display: block;
        }

        .signup-field-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        @media (max-width: 480px) {
            .signup-card {
                padding: 2rem 1.5rem;
            }

            .signup-title {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="signup-card">
        <div class="signup-header">
            <img src="{{ url_for('static', filename='images/logo-newsletter.svg') }}" alt="" class="signup-logo">
            <h1 class="signup-title">Subscribe to No&eacute;'s Newsletter</h1>
        </div>

        {% if success %}
        <div class="signup-success">
            <span class="signup-success-icon">
                <img src="{{ url_for('static', filename='images/icon-check.svg') }}" alt="" style="width: 48px; height: 48px;">
            </span>
            <h2>Welcome aboard!</h2>
            <p>Keep an eye on your inbox for the next iteration.</p>
        </div>
        {% else %}
            {% if error %}
            <div class="signup-error">{{ error }}</div>
            {% endif %}
            <form method="POST" class="signup-form">
                <!-- Honeypot field: invisible to humans, bots will fill it -->
                <div style="position: absolute; left: -9999px;" aria-hidden="true">
                    <input type="text" name="website" tabindex="-1" autocomplete="off">
                </div>
                <div class="signup-field-group">
                    <label class="signup-field-label" for="name">Your name *</label>
                    <input type="text" id="name" name="name" class="signup-input" placeholder="e.g. Alex" required maxlength="200" value="{{ request.form.get('name', '') }}">
                </div>
                <div class="signup-field-group">
                    <label class="signup-field-label" for="email">Email address *</label>
                    <input type="email" id="email" name="email" class="signup-input" placeholder="you@example.com" required maxlength="300" value="{{ request.form.get('email', '') }}">
                </div>
                <div class="signup-field-group">
                    <label class="signup-field-label" for="reason">Why are you interested? (optional)</label>
                    <textarea id="reason" name="reason" class="signup-textarea" placeholder="Anything you'd like to share..." rows="3" maxlength="1000">{{ request.form.get('reason', '') }}</textarea>
                </div>
                <button type="submit" class="signup-btn">Subscribe</button>
            </form>
        {% endif %}
    </div>

    <script>
        // Respect theme preference
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</body>
</html>
