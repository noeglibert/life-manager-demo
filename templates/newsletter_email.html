<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        /* Reset for email clients */
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; }
        img { border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #fafaf9; font-family: Georgia, 'Times New Roman', serif;">
    {% if preview %}
    <!-- Preview bar — only shown in preview mode, not in exported HTML -->
    <div style="background: #1c1917; color: #fafaf9; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; font-family: 'DM Sans', -apple-system, sans-serif; font-size: 0.85rem; position: sticky; top: 0; z-index: 100; -webkit-user-select: none; user-select: none;">
        <div style="display: flex; align-items: center; gap: 12px;">
            <span style="opacity: 0.6;">Newsletter Preview</span>
            <span style="font-weight: 600;">{{ title }}</span>
        </div>
        <div style="display: flex; gap: 10px;">
            <a href="{{ url_for('newsletter_editor', issue_id=issue_id) }}" style="color: #D4A574; text-decoration: none; padding: 4px 12px; border: 1px solid #D4A574; border-radius: 6px; font-size: 0.8rem;">Back to Editor</a>
        </div>
    </div>
    {% endif %}

    <!-- Email wrapper -->
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color: #fafaf9;">
        <tr>
            <td align="center" style="padding: 32px 16px;">
                <!-- Main container -->
                <table role="presentation" cellpadding="0" cellspacing="0" width="700" style="max-width: 700px; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 16px rgba(0,0,0,0.06);">

                    <!-- Header -->
                    <tr>
                        <td style="padding: 40px 40px 24px 40px; border-bottom: 3px solid #8B6914;">
                            <h1 style="margin: 0 0 8px 0; color: #1c1917; font-size: 1.7rem; font-weight: 700; font-family: Georgia, 'Times New Roman', serif; line-height: 1.3;">{{ title }}</h1>
                            {% if issue_date %}
                            <p style="margin: 0; color: #78716c; font-size: 0.9rem; font-family: 'DM Sans', -apple-system, sans-serif;">{{ issue_date }}</p>
                            {% endif %}
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td style="padding: 32px 40px; color: #1c1917; font-size: 1.05rem; line-height: 1.75;">
                            <div class="newsletter-body-content" style="font-family: Georgia, 'Times New Roman', serif;">
                                {{ content_html|safe }}
                            </div>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding: 24px 40px; border-top: 1px solid #e7e5e4; text-align: center;">
                            <p style="margin: 0; color: #a8a29e; font-size: 0.8rem; font-family: 'DM Sans', -apple-system, sans-serif; line-height: 1.5;">
                                To unsubscribe, reply to this email with "unsubscribe".
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>

    <style>
        /* Styles for rendered markdown content — included in both preview and export */
        .newsletter-body-content h1 { font-size: 1.5rem; margin: 1.5rem 0 0.75rem; color: #1c1917; font-weight: 700; border-bottom: 2px solid #e7e5e4; padding-bottom: 0.5rem; }
        .newsletter-body-content h2 { font-size: 1.3rem; margin: 1.5rem 0 0.5rem; color: #1c1917; font-weight: 700; text-align: center; }
        .newsletter-body-content h3 { font-size: 1.1rem; margin: 1.25rem 0 0.5rem; color: #44403c; font-weight: 600; }
        .newsletter-body-content p { margin: 0 0 1rem; }
        .newsletter-body-content a { color: #8B6914; text-decoration: underline; }
        .newsletter-body-content ul, .newsletter-body-content ol { margin: 0 0 1rem; padding-left: 1.5rem; }
        .newsletter-body-content li { margin-bottom: 0.4rem; }
        .newsletter-body-content blockquote { margin: 1rem 0; padding: 0.75rem 1.25rem; border-left: 4px solid #8B6914; background: #fafaf9; color: #57534e; font-style: italic; border-radius: 0 8px 8px 0; }
        .newsletter-body-content hr { border: none; border-top: 2px solid #e7e5e4; margin: 2rem 0; }
        .newsletter-body-content strong { font-weight: 700; }
        .newsletter-body-content em { font-style: italic; }
        .newsletter-body-content code { background: #f5f5f4; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; font-family: monospace; }
        .newsletter-body-content pre { background: #1c1917; color: #fafaf9; padding: 1rem; border-radius: 8px; overflow-x: auto; margin: 1rem 0; }
        .newsletter-body-content pre code { background: none; padding: 0; color: inherit; }
        .newsletter-body-content img { max-width: 100%; height: auto; border-radius: 8px; margin: 0.5rem 0; }
    </style>
</body>
</html>
