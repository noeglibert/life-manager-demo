<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Life Manager</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--background);
            padding: 1rem;
        }

        .login-card {
            background: var(--surface);
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .login-logo {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
        }

        .login-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--slate-dark);
            margin-bottom: 0.25rem;
        }

        .login-subtitle {
            color: var(--slate-light);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .login-input {
            padding: 0.85rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Open Sans', sans-serif;
            background: var(--background);
            color: var(--slate-dark);
            transition: border-color 0.2s;
            text-align: center;
            letter-spacing: 2px;
        }

        .login-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
        }

        .login-input::placeholder {
            letter-spacing: normal;
            color: var(--slate-light);
        }

        .login-btn {
            padding: 0.85rem 1rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .login-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-error {
            background: rgba(245, 101, 101, 0.1);
            color: var(--accent-red);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            border: 1px solid rgba(245, 101, 101, 0.2);
        }

        .login-footer {
            margin-top: 2rem;
            color: var(--slate-light);
            font-size: 0.8rem;
        }

        /* Dark mode support */
        [data-theme="dark"] .login-card {
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="Logo" class="login-logo">
        <h1 class="login-title">Life Manager</h1>
        <p class="login-subtitle">Enter your password to continue</p>

        {% if error %}
        <div class="login-error">{{ error }}</div>
        {% endif %}

        <form method="POST" class="login-form">
            <input
                type="password"
                name="password"
                class="login-input"
                placeholder="Password"
                autofocus
                required
                autocomplete="current-password"
            >
            <button type="submit" class="login-btn">Unlock</button>
        </form>

        <p class="login-footer"><img class="inline-icon" src="/static/images/icon-lock.svg" alt=""> Protected access</p>
    </div>

    <script>
        // Respect saved theme preference
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</body>
</html>
