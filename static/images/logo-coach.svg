<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="pencilTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g filter="url(#pencilTexture)">
    <!-- Compass outer circle -->
    <circle cx="60" cy="58" r="40" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="60" cy="58" r="41" stroke="#8B5A2B" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
    <circle cx="60" cy="58" r="39" stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.3"/>

    <!-- Inner circle -->
    <circle cx="60" cy="58" r="6" stroke="#5D4037" stroke-width="2" fill="none"/>
    <circle cx="60" cy="58" r="7" stroke="#8B5A2B" stroke-width="1" fill="none" opacity="0.4"/>

    <!-- North needle (pointing up) -->
    <path d="M60 52 L56 38 L60 22 L64 38 Z"
          stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 53 L57 39 L60 23 L63 39 Z"
          stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

    <!-- South needle -->
    <path d="M60 64 L56 78 L60 94 L64 78 Z"
          stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 65 L57 79 L60 93 L63 79 Z"
          stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

    <!-- Cardinal direction marks -->
    <!-- East -->
    <path d="M96 58 L100 58" stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M92 58 L96 58" stroke="#8B5A2B" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- West -->
    <path d="M20 58 L24 58" stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M24 58 L28 58" stroke="#8B5A2B" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- Small tick marks -->
    <path d="M60 18 L60 22" stroke="#5D4037" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M60 94 L60 98" stroke="#5D4037" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>

    <!-- Diagonal ticks NE, NW, SE, SW -->
    <path d="M86 30 L83 33" stroke="#5D4037" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M34 30 L37 33" stroke="#5D4037" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M86 86 L83 83" stroke="#5D4037" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M34 86 L37 83" stroke="#5D4037" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- Star/sparkle at north tip -->
    <path d="M60 10 L58 14 L54 14 L57 17 L56 21 L60 18 L64 21 L63 17 L66 14 L62 14 Z"
          stroke="#D4A574" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

    <!-- Highlight arcs -->
    <path d="M35 30 Q45 22 58 20" stroke="#D4A574" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M88 70 Q95 62 96 52" stroke="#D4A574" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Extra sketch marks -->
  <path d="M10 105 L12 103" stroke="#8B5A2B" stroke-width="1" opacity="0.3"/>
  <path d="M108 105 L110 107" stroke="#8B5A2B" stroke-width="1" opacity="0.3"/>
</svg>