<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="pencilTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g filter="url(#pencilTexture)">
    <!-- House roof -->
    <path d="M60 15 L15 55 L25 55 L25 100 L95 100 L95 55 L105 55 Z"
          stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 16 L16 56 L26 56 L26 99 L94 99 L94 56 L104 56 Z"
          stroke="#8B5A2B" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <path d="M60 14 L14 54 L24 54 L24 101 L96 101 L96 54 L106 54 Z"
          stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>

    <!-- Chimney -->
    <path d="M78 30 L78 18 L88 18 L88 38"
          stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M79 31 L79 19 L87 19 L87 37"
          stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

    <!-- Door -->
    <path d="M48 100 L48 68 Q48 64 52 64 L68 64 Q72 64 72 68 L72 100"
          stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M49 99 L49 69 Q49 65 53 65 L67 65 Q71 65 71 69 L71 99"
          stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

    <!-- Door handle -->
    <circle cx="66" cy="83" r="2" stroke="#5D4037" stroke-width="1.5" fill="none"/>

    <!-- Left window -->
    <path d="M30 62 L30 78 L44 78 L44 62 Z"
          stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M37 62 L37 78" stroke="#5D4037" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M30 70 L44 70" stroke="#5D4037" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Right window -->
    <path d="M76 62 L76 78 L90 78 L90 62 Z"
          stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M83 62 L83 78" stroke="#5D4037" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M76 70 L90 70" stroke="#5D4037" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Roof highlight -->
    <path d="M40 38 Q50 30 58 22" stroke="#D4A574" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M90 50 Q96 52 100 55" stroke="#D4A574" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.4"/>

    <!-- Smoke from chimney -->
    <path d="M83 14 Q80 8 84 4" stroke="#D4A574" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M83 12 Q87 6 85 2" stroke="#D4A574" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- Extra sketch marks -->
  <path d="M10 98 L13 100" stroke="#8B5A2B" stroke-width="1" opacity="0.3"/>
  <path d="M107 98 L110 96" stroke="#8B5A2B" stroke-width="1" opacity="0.3"/>
</svg>