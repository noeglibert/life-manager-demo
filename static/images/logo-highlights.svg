    <path d="M86 52 Q90 52 90 58 Q90 64 84 64" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M77 53 Q81 53 81 59 Q81 64 75 64" stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M87 53 Q91 53 91 59 Q91 64 85 64" stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Text lines inside bubble (representing highlighted text) -->
