  <!-- Extra sketch marks for authenticity -->
  <path d="M108 45 L110 47" stroke="#8B5A2B" stroke-width="1" opacity="0.3"/>
  <path d="M15 85 L17 83" stroke="#8B5A2B" stroke-width="1" opacity="0.3"/>
</svg>
