<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="pencilTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  
  <g filter="url(#pencilTexture)">
    <!-- Briefcase/Portfolio outline - multiple strokes for sketchy feel -->
    <!-- Main briefcase body -->
    <path d="M20 45 L20 95 Q20 100 25 100 L95 100 Q100 100 100 95 L100 45 Q100 40 95 40 L25 40 Q20 40 20 45" 
          stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M21 46 L21 94 Q21 99 26 99 L94 99 Q99 99 99 94 L99 46 Q99 41 94 41 L26 41 Q21 41 21 46" 
          stroke="#8B5A2B" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M19 44 L19 96 Q19 101 24 101 L96 101 Q101 101 101 96 L101 44 Q101 39 96 39 L24 39 Q19 39 19 44" 
          stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.3"/>
    
    <!-- Handle on top -->
    <path d="M42 40 L42 28 Q42 25 45 25 L75 25 Q78 25 78 28 L78 40" 
          stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M43 41 L43 29 Q43 26 46 26 L74 26 Q77 26 77 29 L77 41" 
