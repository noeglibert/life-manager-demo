    <!-- Handle grip -->
    <path d="M45 32 L75 32" stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M46 33 L74 33" stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Clasp/Lock -->
    <rect x="55" y="52" width="10" height="8" stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round" rx="2"/>
    <rect x="55.5" y="52.5" width="9" height="7" stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" rx="2" opacity="0.6"/>
    <circle cx="60" cy="56" r="2" stroke="#5D4037" stroke-width="1.5" fill="none"/>
    
    <!-- Front panel seam -->
    <path d="M60 40 L60 100" stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M61 41 L61 99" stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Pocket details -->
    <path d="M30 70 Q30 65 35 65 L55 65 Q60 65 60 70 L60 90 L30 90 L30 70" 
          stroke="#5D4037" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M31 71 Q31 66 36 66 L54 66 Q59 66 59 71 L59 89 L31 89 L31 71" 
          stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Corner reinforcements -->
    <path d="M22 42 L28 42 L28 48" stroke="#5D4037" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M98 42 L92 42 L92 48" stroke="#5D4037" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M22 98 L28 98 L28 92" stroke="#5D4037" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M98 98 L92 98 L92 92" stroke="#5D4037" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <!-- Documents/papers peeking out - representing portfolio contents -->
    <path d="M65 48 L80 48 Q82 48 82 50 L82 90" stroke="#8B5A2B" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M66 49 L79 49 Q81 49 81 51 L81 89" stroke="#D4A574" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M68 53 L78 53" stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M68 58 L77 58" stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M68 63 L75 63" stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Highlight/shine on leather -->
    <path d="M25 48 Q30 46 35 50" stroke="#D4A574" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M85 45 Q90 43 92 48" stroke="#D4A574" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Stitching details -->
    <path d="M24 43 L24 47" stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.4"/>
    <path d="M96 43 L96 47" stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.4"/>
    <path d="M24 93 L24 97" stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.4"/>
    <path d="M96 93 L96 97" stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.4"/>
  </g>
  
  <!-- Extra sketch marks for authenticity -->
  <path d="M16 60 L18 62" stroke="#8B5A2B" stroke-width="1" opacity="0.3"/>
  <path d="M104 75 L102 77" stroke="#8B5A2B" stroke-width="1" opacity="0.3"/>
</svg>
