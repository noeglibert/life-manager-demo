<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="pencilTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  
  <g filter="url(#pencilTexture)">
    <!-- Letter grid boxes - 5x5 Wordle style but sketchy -->
    <!-- Top row -->
    <rect x="20" y="20" width="16" height="16" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round" rx="2"/>
    <rect x="20.5" y="20.5" width="15" height="15" stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" rx="2" opacity="0.5"/>
    
    <rect x="40" y="20" width="16" height="16" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round" rx="2"/>
    <rect x="40.5" y="20.5" width="15" height="15" stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" rx="2" opacity="0.5"/>
    
    <rect x="60" y="20" width="16" height="16" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round" rx="2"/>
    <rect x="60.5" y="20.5" width="15" height="15" stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" rx="2" opacity="0.5"/>
    
    <rect x="80" y="20" width="16" height="16" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round" rx="2"/>
    <rect x="80.5" y="20.5" width="15" height="15" stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" rx="2" opacity="0.5"/>
    
    <rect x="100" y="20" width="16" height="16" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round" rx="2"/>
    <rect x="100.5" y="20.5" width="15" height="15" stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" rx="2" opacity="0.5"/>
    
    <!-- Second row -->
    <rect x="20" y="40" width="16" height="16" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round" rx="2"/>
    <rect x="40" y="40" width="16" height="16" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round" rx="2"/>
    <rect x="60" y="40" width="16" height="16" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round" rx="2"/>
    <rect x="80" y="40" width="16" height="16" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round" rx="2"/>
    <rect x="100" y="40" width="16" height="16" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round" rx="2"/>
    
    <!-- Third row -->
    <rect x="20" y="60" width="16" height="16" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round" rx="2"/>
    <rect x="40" y="60" width="16" height="16" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round" rx="2"/>
    <rect x="60" y="60" width="16" height="16" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round" rx="2"/>
    <rect x="80" y="60" width="16" height="16" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round" rx="2"/>
    <rect x="100" y="60" width="16" height="16" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round" rx="2"/>
    
    <!-- Letters - "WORDLE" written in sketchy style -->
    <!-- W -->
    <path d="M22 26 L24 32 L26 28 L28 32 L30 26" stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M22.5 26.5 L24.5 31.5 L26 28.5 L27.5 31.5 L29.5 26.5" stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6"/>
    
    <!-- O -->
    <ellipse cx="48" cy="28" rx="5" ry="6" stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round"/>
    <ellipse cx="48" cy="28" rx="4.5" ry="5.5" stroke="#8B5A2B" stroke-width="1" fill="none" opacity="0.6"/>
    
    <!-- R -->
    <path d="M62 32 L62 24 Q62 22 64 22 L66 22 Q68 22 68 24 L68 26 Q68 28 66 28 L62 28 L68 32" stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M62.5 31.5 L62.5 24.5 Q62.5 22.5 64 22.5 L66 22.5 Q67.5 22.5 67.5 24.5 L67.5 26 Q67.5 27.5 66 27.5 L62.5 27.5 L67.5 31.5" stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6"/>
    
    <!-- D -->
    <path d="M82 32 L82 24 L85 24 Q88 24 88 28 Q88 32 85 32 L82 32" stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M82.5 31.5 L82.5 24.5 L85 24.5 Q87.5 24.5 87.5 28 Q87.5 31.5 85 31.5 L82.5 31.5" stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6"/>
    
    <!-- L -->
    <path d="M102 24 L102 32 L108 32" stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M102.5 24.5 L102.5 31.5 L107.5 31.5" stroke="#8B5A2B" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Keyboard below -->
    <!-- Keys row -->
    <rect x="30" y="85" width="12" height="12" stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round" rx="2"/>
    <rect x="45" y="85" width="12" height="12" stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round" rx="2"/>
    <rect x="60" y="85" width="12" height="12" stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round" rx="2"/>
    <rect x="75" y="85" width="12" height="12" stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round" rx="2"/>
    
    <!-- Key letters - simplified -->
    <path d="M35 91 L37 91" stroke="#8B5A2B" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M50 91 L52 91" stroke="#8B5A2B" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M65 91 L67 91" stroke="#8B5A2B" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M80 91 L82 91" stroke="#8B5A2B" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <!-- Highlight shine on grid -->
    <path d="M22 22 Q26 21 28 24" stroke="#D4A574" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M62 42 Q66 41 68 44" stroke="#D4A574" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
  </g>
  
  <!-- Extra sketch marks for authenticity -->
  <path d="M16 30 L18 32" stroke="#8B5A2B" stroke-width="1" opacity="0.3"/>
  <path d="M118 50 L116 52" stroke="#8B5A2B" stroke-width="1" opacity="0.3"/>
</svg>
